services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "1222:1222"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/cloud_storage:/app/cloud_storage
    env_file:
      - ./.env
    depends_on:
      - db
    command: npm run start:dev:nodemon
    container_name: wizzcloud-backend-container


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./.env
    depends_on:
      - backend
    command: npm run start:dev:nodemon
    container_name: wizzcloud-frontend-container


  db:
    image: postgres:13
    container_name: wizzcloud-database-container
    ports:
      - "5433:5432"
    env_file:
      - ./.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

  migrations:
    image: migrate/migrate
    volumes:
      - ./wizz-cloud_be/var/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:latest
    container_name: wizzcloud-redis-container
    ports:
      - "6379:6379"
      
volumes:
  pgdata: